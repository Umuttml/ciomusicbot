<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cio Müzik</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --card-border: #2a385b;
            --accent-color: #00f5d4;
            --text-color: #ffffff;
            --subtext-color: #8d99ae;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
            display: flex; flex-direction: column; gap: 12px; min-height: 100vh;
        }

        .banner {
            background: linear-gradient(135deg, #1c2541, #3a506b);
            border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px;
            border: 1px solid var(--card-border);
        }

        .banner-icon {
            width: 44px; height: 44px; background: rgba(0, 245, 212, 0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent-color);
        }

        .banner-text h3 { font-size: 15px; color: var(--accent-color); }
        .banner-text p { font-size: 11px; color: var(--subtext-color); }

        .card {
            background: var(--card-bg); border-radius: 16px; padding: 14px;
            border: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 10px;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 11px; color: var(--subtext-color); font-weight: bold; }
        .badge { background: #00f5d4; color: #0b132b; font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        .player-info { display: flex; align-items: center; gap: 12px; }
        .song-cover {
            width: 48px; height: 48px; background: var(--accent-color);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: #0b132b; font-size: 18px; overflow: hidden;
        }
        .song-cover img { width: 100%; height: 100%; object-fit: cover; }

        .song-details h4 { font-size: 13px; margin-bottom: 2px; }
        .song-details p { font-size: 10px; color: var(--subtext-color); }

        audio { width: 100%; height: 36px; margin-top: 4px; }

        .search-box { display: flex; gap: 6px; }
        .search-box input {
            flex: 1; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--card-border);
            padding: 8px 12px; border-radius: 8px; color: white; outline: none; font-size: 12px;
        }

        .search-box button {
            background: var(--accent-color); color: #0b132b; border: none;
            padding: 0 14px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="banner">
        <div class="banner-icon"><i class="fa-solid fa-compact-disc"></i></div>
        <div class="banner-text">
            <h3>Cio Müzik</h3>
            <p>Arat, dinle, keyfine bak.</p>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-title">OYNATICI</span>
            <span class="badge" id="player-badge">• Hazır</span>
        </div>
        
        <div class="player-info">
            <div class="song-cover" id="song-cover"><i class="fa-solid fa-music"></i></div>
            <div class="song-details">
                <h4 id="song-title">Bir Şarkı Yazın</h4>
                <p id="song-artist">Cio Müzik Player</p>
            </div>
        </div>

        <audio id="audio-player" controls></audio>
    </div>

    <div class="card">
        <span class="card-title">ŞARKI ARA VE DİNLE</span>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Şarkı adı girin (Örn: Sebebi Var)">
            <button id="search-btn" onclick="searchMusic()">Oynat</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // RENDER SUNUCUNUN CANLI ADRESİ
        const API_URL = "https://ciomusicbot.onrender.com"; 

        const player = document.getElementById('audio-player');

        async function searchMusic() {
            const query = document.getElementById('search-input').value.trim();
            const btn = document.getElementById('search-btn');
            if(!query) return;

            btn.disabled = true;
            document.getElementById('song-title').innerText = "Aranıyor...";
            document.getElementById('song-artist').innerText = "Render sunucusuna bağlanılıyor...";
            document.getElementById('player-badge').innerText = "• Yükleniyor";

            try {
                const res = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.success && data.url) {
                    document.getElementById('song-title').innerText = data.title;
                    document.getElementById('song-artist').innerText = data.artist || "Cio Müzik Engine";
                    document.getElementById('player-badge').innerText = "• Çalıyor";

                    if (data.thumbnail) {
                        document.getElementById('song-cover').innerHTML = `<img src="${data.thumbnail}">`;
                    }

                    player.src = data.url;
                    player.load();
                    player.play();
                } else {
                    document.getElementById('song-title').innerText = "Sonuç Bulunamadı";
                    document.getElementById('song-artist').innerText = "Tekrar deneyin.";
                    document.getElementById('player-badge').innerText = "• Hata";
                }
            } catch (e) {
                console.error(e);
                document.getElementById('song-title').innerText = "Bağlantı Hatası";
                document.getElementById('song-artist').innerText = "Sunucu yanıt vermedi.";
                document.getElementById('player-badge').innerText = "• Hata";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
