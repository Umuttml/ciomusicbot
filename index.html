<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cio Müzik</title>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #38bdf8; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        audio { width: 100%; margin-top: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎵 Cio Müzik & Radyo</h1>
        <p>Canlı Yayın Başlatıldı</p>
        
        <!-- Örnek Canlı Radyo Akışı -->
        <audio controls autoplay>
            <source src="https://stream.alemfm.com/alemfm/live/icecast.audio" type="audio/mpeg">
            Tarayıcınız ses ögesini desteklemiyor.
        </audio>
    </div>

    <script>
        // Telegram ekranını genişletir
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
